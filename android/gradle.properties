# Build JVM. Android Gradle Plugin 8.13 and Gradle 9 both require JDK 17 or newer.
# java home يُمرَّر عبر JAVA_HOME — لا مسار مثبت لجهاز بعينه

org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Kept off deliberately: the configuration cache adds a failure mode we gain nothing from on a
# single-module project, and some third-party plugins still trip over it.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
